name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        default: sandbox
        options: [sandbox, production]

permissions:
  contents: read

concurrency:
  group: portfolio-pages-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.repository == 'jovi47/ojoaovsousa-dev' && (github.ref == 'refs/heads/main' || inputs.target == 'sandbox')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'push' && 'production' || inputs.target }}
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check required deployment configuration
        run: >-
          node --input-type=module -e
          "import {createPagesClient} from './scripts/pages-api.mjs';
          createPagesClient({accountId:process.env.CLOUDFLARE_ACCOUNT_ID,
          project:process.env.CLOUDFLARE_PAGES_PROJECT,token:process.env.CLOUDFLARE_API_TOKEN});"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - name: Default build required by the test fixtures
        run: npm run build
      - name: Deployment checks
        run: npm test
      - name: Build exact deployment artifact
        run: node scripts/build.mjs
        env:
          SITE_URL: https://ojoaovsousa.pages.dev
          INDEXABLE: ${{ env.DEPLOY_TARGET == 'production' && 'true' || 'false' }}
          ANALYTICS_PREVIEW: 'false'
      - name: Audit upload paths and content
        run: node scripts/audit.mjs
      - name: Publish, verify and recover if needed
        run: node scripts/deploy-pages.mjs "$DEPLOY_TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
